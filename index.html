<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#075E54"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="EmojiBot"/>
<meta name="description" content="Create custom emoji for WhatsApp, iPhone & Samsung"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<title>EmojiBot Pro</title>
<style>
:root{
  --green:#25D366;--dark:#075E54;--mid:#128C7E;
  --bg-chat:#E5DDD5;--bubble-in:#fff;--bubble-out:#DCF8C6;
  --text:#111;--sub:#666;--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--dark)}
#app{display:flex;flex-direction:column;height:100dvh;max-width:500px;margin:0 auto;background:var(--bg-chat)}

/* HEADER */
#hdr{background:linear-gradient(135deg,var(--dark),var(--mid));color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;flex-shrink:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.hinfo{flex:1}
.hnm{font-size:15px;font-weight:600;letter-spacing:.2px}
.hst{font-size:11px;opacity:.75}
.install-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:14px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap;font-weight:500}
.install-btn:active{background:rgba(255,255,255,.25)}

/* MESSAGES */
#msgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.msg{max-width:82%;display:flex;flex-direction:column}
.msg.u{align-self:flex-end}
.msg.b{align-self:flex-start}
.bbl{padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.45;word-break:break-word}
.msg.u .bbl{background:var(--bubble-out);border-bottom-right-radius:3px;color:var(--text)}
.msg.b .bbl{background:var(--bubble-in);border-bottom-left-radius:3px;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tm{font-size:10px;color:var(--sub);margin-top:3px;align-self:flex-end}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{background:#e8f5e9;border:1px solid #25D366;color:#075E54;border-radius:16px;padding:5px 11px;font-size:12px;cursor:pointer;user-select:none}
.chip:active{background:#c8e6c9}

/* TYPING */
.typi{display:flex;gap:4px;align-items:center;padding:4px 0}
.typi span{width:8px;height:8px;background:#ccc;border-radius:50%;animation:bo 1.2s infinite}
.typi span:nth-child(2){animation-delay:.2s}
.typi span:nth-child(3){animation-delay:.4s}
@keyframes bo{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}

/* EMOJI CARD */
.ecard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0}
.eprev{width:120px;height:120px;border-radius:20px;background:#f5f5f5;border:2px solid #eee;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.eprev img{width:108px;height:108px;image-rendering:crisp-edges}
.elbl{font-size:12px;color:#888;font-style:italic}
.drow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.dbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:#f8f8f8;border:1px solid #e0e0e0;border-radius:14px;padding:8px 4px;cursor:pointer;transition:all .15s;user-select:none}
.dbtn:active{background:#e8f5e9;border-color:var(--green)}
.dico{font-size:20px}
.dplat{font-size:11px;font-weight:600;color:#333}
.dsz{font-size:9px;color:#999}
.cbtn{background:var(--dark);color:#fff;border:none;border-radius:20px;padding:7px 18px;font-size:13px;cursor:pointer;font-family:inherit;width:100%}
.cbtn:active{background:var(--mid)}
.cbtn.ok{background:var(--green)}
.tip{font-size:11px;color:#888;background:#fffde7;border-radius:8px;padding:6px 10px;text-align:center;line-height:1.4}

/* INPUT */
#inp{background:#f0f0f0;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;border-top:1px solid #ddd;flex-shrink:0}
#inp input{flex:1;border:none;border-radius:24px;padding:11px 16px;font-size:15px;background:#fff;outline:none;font-family:inherit;color:var(--text);min-width:0}
#sbtn{width:44px;height:44px;border-radius:50%;background:var(--dark);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0}
#sbtn:active{background:var(--mid)}
#sbtn:disabled{background:#aaa}

/* INSTALL BANNER */
#ibanner{background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;flex-shrink:0;display:none}
#ibanner.show{display:flex}
.ibnr-txt{flex:1;line-height:1.3}
.ibnr-btn{background:#fff;color:var(--dark);border:none;border-radius:14px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.ibnr-x{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;opacity:.8;padding:0 4px}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="av">🎨</div>
    <div class="hinfo">
      <div class="hnm">EmojiBot Pro</div>
      <div class="hst">Creates real sendable emoji ✓</div>
    </div>
    <button class="install-btn" id="instHdrBtn" style="display:none" onclick="triggerInstall()">⬇ Install App</button>
  </div>

  <div id="ibanner">
    <div class="ibnr-txt">📲 Install EmojiBot on your home screen for quick access!</div>
    <button class="ibnr-btn" onclick="triggerInstall()">Install</button>
    <button class="ibnr-x" onclick="dismissBanner()">✕</button>
  </div>

  <div id="msgs"></div>

  <div id="inp">
    <input id="txt" type="text" placeholder="Describe your emoji..." maxlength="100" autocomplete="off" autocorrect="off"/>
    <button id="sbtn" onclick="send()">➤</button>
  </div>
</div>

<canvas id="cvs" style="display:none"></canvas>

<script>
// ── PWA Install ──────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('ibanner').classList.add('show');
  document.getElementById('instHdrBtn').style.display = 'block';
});
window.addEventListener('appinstalled', () => {
  document.getElementById('ibanner').classList.remove('show');
  document.getElementById('instHdrBtn').style.display = 'none';
});
function triggerInstall(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.prompt().catch(()=>{});deferredPrompt=null;}
}
function dismissBanner(){document.getElementById('ibanner').classList.remove('show');}

// ── Service Worker ───────────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

// ── Chat helpers ─────────────────────────────────────────────
const msgs = document.getElementById('msgs');
const txt  = document.getElementById('txt');
const sb   = document.getElementById('sbtn');
const cvs  = document.getElementById('cvs');

function gt(){
  const d=new Date();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}
function addMsg(type, html){
  const d=document.createElement('div');
  d.className='msg '+type;
  const b=document.createElement('div');
  b.className='bbl';
  b.innerHTML=html;
  const t=document.createElement('div');
  t.className='tm';
  t.textContent=gt()+(type==='u'?' ✓✓':'');
  d.appendChild(b);d.appendChild(t);
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
  return d;
}
function showTyp(){
  const d=document.createElement('div');
  d.className='msg b';d.id='typi';
  d.innerHTML='<div class="bbl"><div class="typi"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}
function rmTyp(){const t=document.getElementById('typi');if(t)t.remove();}
function qs(v){txt.value=v;send();}
txt.addEventListener('keydown',e=>{if(e.key==='Enter')send();});

// ── SVG → PNG ────────────────────────────────────────────────
function svgToPng(svgStr, size){
  return new Promise((res,rej)=>{
    const blob=new Blob([svgStr],{type:'image/svg+xml'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      cvs.width=size;cvs.height=size;
      const ctx=cvs.getContext('2d');
      ctx.clearRect(0,0,size,size);
      ctx.drawImage(img,0,0,size,size);
      URL.revokeObjectURL(url);
      res(cvs.toDataURL('image/png'));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej();};
    img.src=url;
  });
}

function dlPng(dataUrl, name){
  const a=document.createElement('a');
  a.href=dataUrl;a.download=name;a.click();
}

// ── API Call ─────────────────────────────────────────────────
async function callClaude(userDesc){
  const prompt=`You are a world-class emoji designer creating emoji in the style of Apple/Google/WhatsApp official emoji sets.

The user wants: "${userDesc}"

SVG Design rules (follow exactly):
- viewBox="0 0 100 100" ONLY
- Base: filled circle covering 90%+ of canvas, use radial gradient for depth
- Apply drop shadow filter: <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/></filter>
- Character fills ~80% of circle
- Use gradients on all body parts (lighter top, darker bottom) for 3D look
- Eyes: white sclera, colored iris, dark pupil, tiny white highlight dot
- Add specular highlight: small white semi-transparent ellipse on upper-left of main circle
- Bold outlines stroke="#000" opacity="0.15" stroke-width="1.5" on character edges
- Colors: vivid, saturated, cheerful — like official emoji
- Style: modern flat emoji (Apple/Twemoji) — NOT clipart
- NO text, NO labels inside SVG

Output ONLY raw SVG. Start with <svg and end with </svg>. Absolutely nothing else.`;

  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:1500,
      messages:[{role:'user',content:prompt}]
    })
  });
  const data=await r.json();
  return data?.content?.[0]?.text||'';
}

// ── Send Message ─────────────────────────────────────────────
async function send(){
  const val=txt.value.trim();
  if(!val||sb.disabled)return;
  txt.value='';
  sb.disabled=true;

  addMsg('u', val);
  showTyp();

  try{
    const raw=await callClaude(val);
    const m=raw.match(/<svg[\s\S]*?<\/svg>/i);
    rmTyp();

    if(!m){
      addMsg('b',"Hmm, couldn't make that one. Try a different description! 🙏");
      sb.disabled=false;txt.focus();return;
    }

    const svgStr=m[0];
    const label=val.replace(/emoji/gi,'').trim();
    const safeName=label.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');

    addMsg('b','Rendering in all platform sizes... ⚡');

    const [wa72, ip160, sam160] = await Promise.all([
      svgToPng(svgStr,72),
      svgToPng(svgStr,160),
      svgToPng(svgStr,160)
    ]);

    const div=addMsg('b',`
      <div class="ecard">
        <div class="eprev"><img src="${ip160}" alt="${label} emoji"/></div>
        <div class="elbl">✨ ${label}</div>
        <div class="drow">
          <div class="dbtn" id="d1"><div class="dico">💬</div><div class="dplat">WhatsApp</div><div class="dsz">72×72 px</div></div>
          <div class="dbtn" id="d2"><div class="dico">📱</div><div class="dplat">iPhone</div><div class="dsz">160×160 px</div></div>
          <div class="dbtn" id="d3"><div class="dico">🤖</div><div class="dplat">Samsung</div><div class="dsz">160×160 px</div></div>
        </div>
        <button class="cbtn" id="copybtn">📋 Copy image to clipboard</button>
        <div class="tip">💡 Download → send as image/sticker in your app</div>
      </div>
    `);

    const bbl=div.querySelector('.bbl');
    bbl.querySelector('#d1').onclick=()=>dlPng(wa72,safeName+'_whatsapp_72.png');
    bbl.querySelector('#d2').onclick=()=>dlPng(ip160,safeName+'_iphone_160.png');
    bbl.querySelector('#d3').onclick=()=>dlPng(sam160,safeName+'_samsung_160.png');

    const cb=bbl.querySelector('#copybtn');
    cb.onclick=async()=>{
      try{
        const res2=await fetch(ip160);
        const blob=await res2.blob();
        await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        cb.textContent='✅ Copied!';cb.classList.add('ok');
        setTimeout(()=>{cb.textContent='📋 Copy image to clipboard';cb.classList.remove('ok');},2500);
      }catch(e){
        cb.textContent='⚠️ Copy not supported here';
        setTimeout(()=>{cb.textContent='📋 Copy image to clipboard';},2500);
      }
    };

  }catch(e){
    rmTyp();
    addMsg('b','Connection error. Check your internet and try again 😅');
  }
  sb.disabled=false;txt.focus();
}

// ── Boot message ─────────────────────────────────────────────
(function boot(){
  addMsg('b',`Hey! I'm <b>EmojiBot Pro</b> 🎨<br>
    Describe any emoji → I'll create real PNG files ready to send on WhatsApp, iPhone & Samsung!
    <div class="chips">
      <span class="chip" onclick="qs('dwarf with big beard')">🧙 dwarf</span>
      <span class="chip" onclick="qs('fire breathing dragon')">🐲 dragon</span>
      <span class="chip" onclick="qs('cool robot with sunglasses')">🤖 robot</span>
      <span class="chip" onclick="qs('angry viking warrior')">⚔️ viking</span>
      <span class="chip" onclick="qs('sleepy panda')">🐼 panda</span>
      <span class="chip" onclick="qs('magical fairy with glowing wings')">🧚 fairy</span>
      <span class="chip" onclick="qs('laughing taco')">🌮 taco</span>
      <span class="chip" onclick="qs('happy dinosaur')">🦕 dino</span>
    </div>`);
})();
</script>
</body>
</html>
